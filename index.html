<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上海活力组织研究院 · 资源中心</title>
<style>
  :root{
    --ink:#111; --sub:#8a8a8a; --line:#f0f0f0; --chip:#f2f2f2; --chip-ink:#444;
    --btn:#111; --tag:#666;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* 关键：竖向滚动条常驻，页面可用宽度恒定；切换分类内容变长变短都不再左右跳动 */
  html{overflow-y:scroll;scrollbar-gutter:stable}
  body{background:#fff;color:var(--ink);line-height:1.5;overflow-x:clip;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:840px;margin:0 auto;padding:40px 20px 80px}

  /* 表头：返回项目（面包屑）+ 标题 */
  .ret{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);
    text-decoration:none;border:1px solid #ececec;padding:6px 13px;border-radius:20px;
    transition:.12s;white-space:nowrap;margin-bottom:16px}
  .ret:hover{background:#fafafa;color:var(--ink)}
  h1{font-size:22px;font-weight:600;letter-spacing:.3px}
  .stats{margin-top:6px;font-size:13px;color:var(--sub)}

  .search{margin-top:22px;position:relative}
  .search input{width:100%;height:42px;border:1px solid #e6e6e6;border-radius:10px;
    padding:0 14px 0 40px;font-size:14px;color:var(--ink);outline:none;background:#fff}
  .search input:focus{border-color:#cfcfcf}
  .search input::placeholder{color:#b5b5b5}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:#b5b5b5}
  .tabs{margin-top:20px;display:flex;gap:7px;flex-wrap:wrap;padding-bottom:2px}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--chip);color:var(--chip-ink);
    font-size:13px;border:0;cursor:pointer;white-space:nowrap;transition:.12s}
  .tab:hover{background:#e8e8e8}
  .tab.on{background:#111;color:#fff}
  .count{margin-top:22px;font-size:13px;color:var(--sub)}
  .list{margin-top:6px}
  .row{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row:hover .title{text-decoration:underline}
  /* 二级（子链接）：向右缩进 + 左侧引导线，体现层级 */
  .row.child{padding-left:36px;position:relative;border-bottom-color:#f7f7f7}
  .row.child::before{content:"";position:absolute;left:18px;top:12px;bottom:12px;width:1px;background:#e6e6e6}
  .row.child .title{font-size:14px;font-weight:400;color:#333}
  .row.child .meta{font-size:12px}
  .row.child .btn{padding:6px 14px;font-size:12.5px}
  .row.parent .title{font-weight:600}
  .main{flex:1;min-width:0}
  .title{font-size:15px;font-weight:500;color:#111;text-decoration:none;display:block}
  .meta{margin-top:5px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .tag{font-size:12px;color:var(--tag);background:#fafafa;border:1px solid #eee;
    border-radius:4px;padding:2px 7px;white-space:nowrap}
  .btn{display:inline-block;background:var(--btn);color:#fff;font-size:13px;font-weight:500;
    padding:8px 18px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:.12s;border:0;cursor:pointer}
  .btn:hover{opacity:.85}
  .empty{padding:40px 0;text-align:center;color:#b5b5b5;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="ret" id="retProj" href="#" target="_blank" rel="noopener">返回项目 ↗</a>
  <h1>上海活力组织研究院 · 资源中心</h1>
  <div class="stats" id="stats"></div>

  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
    </svg>
    <input id="q" type="text" placeholder="搜索资源、标签、简介…" autocomplete="off" />
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<script>
const TYPE={doc:"文档",video:"视频",image:"图片",link:"链接",other:"文件"};
const PROD={pdf:"PDF",docx:"Word",xlsx:"Excel",pptx:"PPT",mp4:"视频",jpg:"图片",png:"图片",txt:"文本",url:"链接"};
/* 「返回项目」目标 = 研究院官网主站 */
const PROJECT_URL="https://sivo-sivo-d5gznqqes1eec60f8.webapps.tcloudbase.com/";
let DATA={categories:[],project:""}, cur="全部", kw="";

function extOf(f){const m=(f||"").match(/\.([a-z0-9]+)(?:[?#]|$)/i);return m?m[1].toLowerCase():"";}
function allItems(){
  const out=[];
  (DATA.categories||[]).forEach(c=>{
    (c.items||[]).forEach(it=>out.push(Object.assign({_cat:c.name},it)));
  });
  return out;
}
let tabBtns=[];
function renderTabs(){
  const tabs=document.getElementById("tabs");
  const names=["全部"].concat((DATA.categories||[]).map(c=>c.name));
  tabs.innerHTML=""; tabBtns=[];
  names.forEach(n=>{
    const b=document.createElement("button");
    b.className="tab"; b.type="button"; b.textContent=n; b._name=n;
    b.onclick=()=>{ if(cur===n) return; cur=n; updateActive(); renderList(); };
    tabs.appendChild(b); tabBtns.push(b);
  });
  updateActive();
}
/* 只切高亮，不重建 DOM —— 避免点击时整排重绘导致页面/滚动条"跳一下" */
function updateActive(){
  tabBtns.forEach(b=>b.classList.toggle("on", b._name===cur));
}
function typeLabel(it){
  const ext=extOf(it.file);
  return (it.type&&it.type!=="other")?((ext&&PROD[ext])||TYPE[it.type]||"文件"):((ext&&PROD[ext])||"文件");
}
function makeRow(it,isChild,cat){
  const kids=it.children||[];
  const isContainer=kids.length>0;
  const empty=!it.file&&!isContainer;
  const typeTxt=typeLabel(it);
  const isDl=it.permission==="download";
  const dlName=(it.file||"").split("/").pop().split("\\").pop();
  const titleHtml=it.file
    ? `<a class="title" href="${it.file}" target="_blank" rel="noopener">${it.title||"未命名"}</a>`
    : `<span class="title">${it.title||"未命名"}</span>`;
  let right;
  if(isContainer){ right=`<span class="tag">共 ${kids.length} 个教程</span>`; }
  else if(empty){ right=`<span class="tag">待补充</span><span class="btn" style="opacity:.45;cursor:not-allowed">待补充</span>`; }
  else if(isDl){ right=`<span class="tag">${typeTxt}</span><a class="btn" href="${it.file}" download="${dlName}">下载</a>`; }
  else { right=`<span class="tag">${typeTxt}</span><a class="btn" href="${it.file}" target="_blank" rel="noopener">查看</a>`; }
  let metaTxt;
  if(isContainer){ metaTxt=(it.desc||"二级教程合集")+" · 共 "+kids.length+" 个教程"; }
  else if(empty){ metaTxt="待补充 · "+(cat||""); }
  else { metaTxt=typeTxt+" · "+(cat||"")+(it.desc?(" · "+it.desc):""); }
  const row=document.createElement("div");
  row.className="row"+(isChild?" child":"")+(isContainer?" parent":"");
  row.innerHTML=`<div class="main">${titleHtml}<div class="meta">${metaTxt}</div></div><div class="right">${right}</div>`;
  return row;
}
function countAll(){
  let n=0;
  (DATA.categories||[]).forEach(c=>(c.items||[]).forEach(it=>{ n++; n+=(it.children||[]).length; }));
  return n;
}
function renderList(){
  const list=document.getElementById("list");
  let items=allItems();
  if(cur!=="全部") items=items.filter(i=>i._cat===cur);
  const k=kw?kw.toLowerCase():"";
  const frag=[]; let shown=0;
  items.forEach(it=>{
    const kids=it.children||[];
    if(!k){
      frag.push(makeRow(it,false,it._cat)); shown++;
      kids.forEach(ch=>{ frag.push(makeRow(ch,true,it._cat)); shown++; });
      return;
    }
    const pHit=(it.title||"").toLowerCase().includes(k)||(it.desc||"").toLowerCase().includes(k)||(it._cat||"").toLowerCase().includes(k);
    const hit=kids.filter(ch=>(ch.title||"").toLowerCase().includes(k)||(ch.desc||"").toLowerCase().includes(k));
    if(pHit){
      frag.push(makeRow(it,false,it._cat)); shown++;
      kids.forEach(ch=>{ frag.push(makeRow(ch,true,it._cat)); shown++; });
    }else if(hit.length){
      frag.push(makeRow(it,false,it._cat)); shown++;
      hit.forEach(ch=>{ frag.push(makeRow(ch,true,it._cat)); shown++; });
    }
  });
  document.getElementById("count").textContent="共 "+shown+" 个资源";
  list.innerHTML="";
  if(shown===0){list.innerHTML='<div class="empty">暂无资源</div>';return;}
  frag.forEach(n=>list.appendChild(n));
}
function renderStats(){
  const cats=(DATA.categories||[]);
  document.getElementById("stats").textContent=
    "共 "+countAll()+" 个资源 · "+cats.length+" 个分类"+(DATA.updated?" · 更新于 "+DATA.updated:"");
}
async function init(){
  const ret=document.getElementById("retProj");
  try{const r=await fetch("data.json",{cache:"no-store"});DATA=await r.json();}
  catch(e){document.getElementById("list").innerHTML='<div class="empty">数据加载失败</div>';return;}
  ret.href=(DATA.project&&DATA.project.trim())||PROJECT_URL;
  renderStats();renderTabs();renderList();
  document.getElementById("q").addEventListener("input",e=>{kw=e.target.value.trim();renderList();});
}
init();
</script>
</body>
</html>
